<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unsubscribe | North Dallas Alphas</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="images/xtl-logo.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a0a;
      color: #e2e2e2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #111;
      border: 1px solid rgba(201,168,76,0.15);
      border-radius: 10px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .logo { height: 56px; width: 56px; border-radius: 50%; border: 2px solid rgba(201,168,76,0.4); margin: 0 auto 20px; display: block; }
    h1 { font-family: 'Playfair Display', serif; font-size: 1.4rem; color: #C9A84C; margin-bottom: 10px; }
    p { font-size: 0.88rem; color: rgba(255,255,255,0.45); line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #C9A84C;
      color: #000;
      border: none;
      border-radius: 7px;
      font-family: 'Inter', sans-serif;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      width: 100%;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { border-radius: 6px; padding: 12px 16px; font-size: 0.84rem; margin-top: 16px; display: none; }
    .msg.show { display: block; }
    .msg.success { background: rgba(39,174,96,0.1); border: 1px solid rgba(39,174,96,0.3); color: #27ae60; }
    .msg.error   { background: rgba(231,76,60,0.1);  border: 1px solid rgba(231,76,60,0.3);  color: #e74c3c; }
    .resubscribe { margin-top: 16px; font-size: 0.8rem; color: rgba(255,255,255,0.25); }
    .resubscribe a { color: rgba(201,168,76,0.55); cursor: pointer; text-decoration: none; }
    .resubscribe a:hover { color: #C9A84C; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.2); border-top-color: #000; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="card">
  <img src="images/xtl-logo.png" alt="Xi Tau Lambda" class="logo" />
  <h1 id="cardTitle">Unsubscribe</h1>
  <p id="cardBody">You will no longer receive chapter email newsletters. You can still access the member portal at any time.</p>
  <button class="btn" id="unsubBtn" onclick="doUnsubscribe()">Confirm Unsubscribe</button>
  <div class="msg" id="msgBox"></div>
  <p class="resubscribe" id="resubWrap" style="display:none;">
    Changed your mind? <a onclick="doResubscribe()">Re-subscribe to emails</a>
  </p>
</div>

<script>
  const SUPABASE_URL      = 'https://fbjervpgxnbyntylabfr.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiamVydnBneG5ieW50eWxhYmZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NzU1ODksImV4cCI6MjA5MjA1MTU4OX0.cMGLe14EDNivZHREWvmE7QMHjb4V_STx0Mfbx7AT4dg';

  var email = '';
  try {
    var t = new URLSearchParams(window.location.search).get('t') || '';
    email = t ? atob(decodeURIComponent(t)) : '';
  } catch(e) {}

  if (!email || !email.includes('@')) {
    document.getElementById('cardTitle').textContent = 'Invalid Link';
    document.getElementById('cardBody').textContent  = 'This unsubscribe link is invalid or has expired. Please contact the chapter directly.';
    document.getElementById('unsubBtn').style.display = 'none';
  }

  async function patchOptOut(val) {
    var res = await fetch(SUPABASE_URL + '/rest/v1/members?email=eq.' + encodeURIComponent(email), {
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify({ email_opt_out: val }),
    });
    return res.ok;
  }

  function showMsg(type, text) {
    var el = document.getElementById('msgBox');
    el.className = 'msg show ' + type;
    el.textContent = text;
  }

  async function doUnsubscribe() {
    var btn = document.getElementById('unsubBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Processing…';
    var ok = await patchOptOut(true);
    if (ok) {
      document.getElementById('cardTitle').textContent = 'You\'re Unsubscribed';
      document.getElementById('cardBody').textContent  = 'You\'ve been removed from chapter newsletters. You can still access the member portal at any time.';
      btn.style.display = 'none';
      document.getElementById('resubWrap').style.display = 'block';
    } else {
      btn.disabled = false;
      btn.textContent = 'Confirm Unsubscribe';
      showMsg('error', 'Something went wrong. Please try again or contact the chapter directly.');
    }
  }

  async function doResubscribe() {
    var ok = await patchOptOut(false);
    if (ok) {
      document.getElementById('cardTitle').textContent = 'You\'re Re-subscribed';
      document.getElementById('cardBody').textContent  = 'You\'ll receive chapter newsletters again.';
      document.getElementById('resubWrap').style.display = 'none';
    }
  }
</script>
</body>
</html>
