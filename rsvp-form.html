<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RSVP — North Dallas Alphas</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { width: 100%; max-width: 420px; background: #111; border: 1px solid rgba(201,168,76,0.3); border-radius: 12px; padding: 32px 28px; }
  .logo { text-align: center; margin-bottom: 20px; }
  .logo img { width: 64px; height: auto; }
  h1 { font-size: 1.3rem; font-weight: 700; color: #C9A84C; margin-bottom: 4px; text-align: center; }
  .event-meta { font-size: 0.82rem; color: #aaa; text-align: center; margin-bottom: 20px; line-height: 1.6; }
  .response-banner { text-align: center; padding: 10px; border-radius: 6px; font-weight: 700; font-size: 0.9rem; margin-bottom: 20px; }
  .response-yes { background: rgba(22,163,74,0.15); border: 1px solid #16a34a; color: #4ade80; }
  .response-maybe { background: rgba(201,168,76,0.15); border: 1px solid #C9A84C; color: #C9A84C; }
  .response-no { background: rgba(107,114,128,0.15); border: 1px solid #6b7280; color: #9ca3af; }
  label { display: block; font-size: 0.78rem; color: #aaa; margin-bottom: 5px; }
  input[type="text"], input[type="email"] {
    width: 100%; padding: 10px 12px; background: #1a1a1a; border: 1px solid rgba(201,168,76,0.3);
    border-radius: 6px; color: #fff; font-size: 0.9rem; margin-bottom: 14px;
    font-family: inherit; outline: none; transition: border-color .2s;
  }
  input:focus { border-color: #C9A84C; }
  .change-response { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; }
  .change-response a { font-size: 0.75rem; padding: 5px 14px; border-radius: 4px; text-decoration: none; font-weight: 700; }
  .btn-submit { width: 100%; padding: 12px; background: #C9A84C; color: #000; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: 700; cursor: pointer; font-family: inherit; transition: background .2s; }
  .btn-submit:hover { background: #b8963e; }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
  .msg { text-align: center; padding: 12px; border-radius: 6px; font-size: 0.85rem; margin-top: 14px; display: none; }
  .msg.success { background: rgba(22,163,74,0.15); border: 1px solid #16a34a; color: #4ade80; }
  .msg.error { background: rgba(220,38,38,0.15); border: 1px solid #dc2626; color: #f87171; }
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="images/xtl-logo.png" alt="Xi Tau Lambda" /></div>
  <h1 id="eventName">Loading…</h1>
  <div class="event-meta" id="eventMeta"></div>

  <div class="response-banner" id="responseBanner"></div>

  <form id="rsvpForm">
    <label for="nameInput">Your Full Name *</label>
    <input type="text" id="nameInput" placeholder="e.g. Michael Finch" required />

    <label for="emailInput">Email (optional)</label>
    <input type="email" id="emailInput" placeholder="your@email.com" />

    <div class="change-response" id="changeResponse"></div>

    <button type="submit" class="btn-submit" id="submitBtn">Confirm RSVP</button>
  </form>
  <div class="msg" id="msgBox"></div>
</div>

<script>
const SUPABASE_URL = 'https://fbjervpgxnbyntylabfr.supabase.co';

const params = new URLSearchParams(window.location.search);
const newsletterId = params.get('newsletter_id') || '';
const rsvpId = params.get('rsvp_id') || '';
const eventName = params.get('event') || 'Chapter Event';
const eventDate = params.get('date') || '';
const eventLocation = params.get('location') || '';
let response = params.get('response') || 'yes';

document.getElementById('eventName').textContent = eventName;
document.title = 'RSVP — ' + eventName;

const meta = [];
if (eventDate) meta.push('📅 ' + eventDate);
if (eventLocation) meta.push('📍 ' + eventLocation);
document.getElementById('eventMeta').textContent = meta.join('  ·  ');

function setResponse(r) {
  response = r;
  const banner = document.getElementById('responseBanner');
  if (r === 'yes') { banner.className = 'response-banner response-yes'; banner.textContent = '✓ Yes — I will attend'; }
  else if (r === 'maybe') { banner.className = 'response-banner response-maybe'; banner.textContent = '~ Maybe — I might attend'; }
  else { banner.className = 'response-banner response-no'; banner.textContent = '✗ No — I cannot attend'; }
  renderChangeLinks();
}

function renderChangeLinks() {
  const opts = [
    { r: 'yes', label: '✓ Yes', cls: 'background:#16a34a;color:#fff;' },
    { r: 'maybe', label: '~ Maybe', cls: 'background:#C9A84C;color:#000;' },
    { r: 'no', label: '✗ No', cls: 'background:#4b5563;color:#fff;' }
  ];
  document.getElementById('changeResponse').innerHTML = '<span style="font-size:0.72rem;color:#666;align-self:center;">Change:</span>'
    + opts.filter(function(o) { return o.r !== response; }).map(function(o) {
        return '<a href="#" style="' + o.cls + '" onclick="event.preventDefault();setResponse(\'' + o.r + '\')">' + o.label + '</a>';
      }).join('');
}

setResponse(response);

document.getElementById('rsvpForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const name = document.getElementById('nameInput').value.trim();
  const email = document.getElementById('emailInput').value.trim();
  if (!name) { showMsg('Please enter your name.', 'error'); return; }
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const res = await fetch(SUPABASE_URL + '/functions/v1/record-rsvp-response', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ newsletter_id: newsletterId, rsvp_id: rsvpId, event_name: eventName, response: response, name: name, email: email })
    });
    const data = await res.json().catch(function() { return {}; });
    if (!res.ok) throw new Error(data.error || 'Submission failed');
    document.getElementById('rsvpForm').style.display = 'none';
    showMsg('Thank you, Brother ' + name.split(' ')[0] + '! Your RSVP has been recorded.', 'success');
  } catch(err) {
    btn.disabled = false; btn.textContent = 'Confirm RSVP';
    showMsg(err.message || 'Something went wrong. Please try again.', 'error');
  }
});

function showMsg(text, type) {
  const el = document.getElementById('msgBox');
  el.textContent = text; el.className = 'msg ' + type; el.style.display = 'block';
}
</script>
</body>
</html>
