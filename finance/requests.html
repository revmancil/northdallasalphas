<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member Requests | North Dallas Alphas Finance</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../images/xtl-logo.png" type="image/png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black:#0a0a0a; --dark:#111; --dark2:#181818;
      --gold:#C9A84C; --gold-pale:rgba(201,168,76,0.08);
      --white:#ffffff; --gray-400:#9ca3af;
      --green:#22c55e; --green-pale:rgba(34,197,94,0.1);
      --red:#ef4444;   --red-pale:rgba(239,68,68,0.1);
      --amber:#f59e0b;
      --sidebar-w:260px;
    }
    html,body{height:100%;}
    body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--white);display:flex;min-height:100vh;}
    .sidebar{width:var(--sidebar-w);background:var(--dark2);border-right:1px solid rgba(201,168,76,0.12);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;overflow-y:auto;}
    .sidebar-brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:12px;}
    .sidebar-brand img{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(201,168,76,0.4);object-fit:contain;}
    .sidebar-brand-text .name{font-family:'Playfair Display',serif;font-size:0.88rem;font-weight:700;color:var(--gold);line-height:1.2;}
    .sidebar-brand-text .sub{font-size:0.62rem;color:rgba(255,255,255,0.3);letter-spacing:0.08em;text-transform:uppercase;}
    .sidebar-user{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:12px;}
    .user-avatar{width:34px;height:34px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.82rem;color:var(--black);flex-shrink:0;overflow:hidden;}
    .user-avatar img{width:100%;height:100%;object-fit:cover;}
    .user-info .uname{font-size:0.82rem;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .user-info .urole{font-size:0.7rem;color:rgba(255,255,255,0.35);margin-top:2px;}
    .sidebar-nav{padding:10px 0;flex:1;}
    .nav-label{font-size:0.62rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.22);padding:10px 20px 5px;}
    .nav-item{display:flex;align-items:center;gap:11px;padding:10px 20px;color:rgba(255,255,255,0.5);font-size:0.85rem;font-weight:500;border:none;background:none;width:100%;text-align:left;transition:color 0.2s,background 0.2s;border-left:3px solid transparent;text-decoration:none;}
    .nav-item i{width:18px;text-align:center;font-size:0.88rem;}
    .nav-item:hover{color:var(--white);background:rgba(255,255,255,0.04);}
    .nav-item.active{color:var(--gold);background:var(--gold-pale);border-left-color:var(--gold);}
    .nav-divider{border:none;border-top:1px solid rgba(255,255,255,0.06);margin:6px 0;}
    .sidebar-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,0.06);}
    .logout-btn{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,0.4);font-size:0.82rem;background:none;border:none;cursor:pointer;padding:7px 0;transition:color 0.2s;width:100%;}
    .logout-btn:hover{color:var(--red);}
    .main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;}
    .topbar{background:var(--dark2);border-bottom:1px solid rgba(255,255,255,0.06);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
    .page-title{font-size:1rem;font-weight:600;color:var(--white);}
    .breadcrumb{font-size:0.78rem;color:var(--gray-400);margin-left:6px;}
    .content{padding:28px;flex:1;}
    .card{background:var(--dark2);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:24px;margin-bottom:20px;}
    .card-title{font-size:0.95rem;font-weight:700;color:var(--white);margin-bottom:4px;display:flex;align-items:center;gap:8px;}
    .card-title i{color:var(--gold);}
    .card-sub{font-size:0.78rem;color:var(--gray-400);margin-bottom:20px;}
    .type-btn{padding:8px 16px;border-radius:7px;font-size:0.83rem;font-weight:600;border:1px solid rgba(255,255,255,0.12);background:none;color:rgba(255,255,255,0.45);cursor:pointer;transition:all 0.2s;}
    .type-btn.active{background:var(--gold-pale);color:var(--gold);border-color:rgba(201,168,76,0.35);}
    select.filter-sel{padding:7px 12px;background:var(--dark);border:1px solid rgba(255,255,255,0.12);color:var(--white);border-radius:7px;font-size:0.82rem;}
    table{width:100%;border-collapse:collapse;font-size:0.84rem;}
    th{padding:10px 12px;text-align:left;color:var(--gray-400);font-size:0.72rem;text-transform:uppercase;letter-spacing:0.07em;border-bottom:1px solid rgba(255,255,255,0.08);}
    td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.05);vertical-align:middle;}
    .badge{display:inline-block;border-radius:20px;padding:2px 10px;font-size:0.72rem;font-weight:700;}
    .badge-pending{background:rgba(245,158,11,0.15);color:#f59e0b;border:1px solid rgba(245,158,11,0.3);}
    .badge-approved{background:rgba(34,197,94,0.12);color:#4ade80;border:1px solid rgba(34,197,94,0.25);}
    .badge-denied{background:rgba(239,68,68,0.12);color:#f87171;border:1px solid rgba(239,68,68,0.25);}
    .btn-approve{background:var(--green-pale);color:var(--green);border:1px solid rgba(34,197,94,0.3);border-radius:6px;padding:4px 11px;font-size:0.75rem;cursor:pointer;margin-right:4px;}
    .btn-deny{background:var(--red-pale);color:var(--red);border:1px solid rgba(239,68,68,0.3);border-radius:6px;padding:4px 11px;font-size:0.75rem;cursor:pointer;}
    .btn-approve:hover{background:rgba(34,197,94,0.2);}
    .btn-deny:hover{background:rgba(239,68,68,0.2);}
    .empty{text-align:center;padding:48px;color:var(--gray-400);}
    .toast{position:fixed;bottom:24px;right:24px;background:#1e1e2e;border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:12px 18px;font-size:0.85rem;color:var(--white);display:flex;align-items:center;gap:10px;z-index:9999;opacity:0;transform:translateY(10px);transition:all 0.3s;pointer-events:none;}
    .toast.show{opacity:1;transform:translateY(0);}
    .toast.error{border-color:rgba(239,68,68,0.3);}
    .toast i{color:var(--green);}
    .toast.error i{color:var(--red);}
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <img src="../images/xtl-logo.png" alt="XTL Logo" />
    <div class="sidebar-brand-text">
      <div class="name">Finance Portal</div>
      <div class="sub">Xi Tau Lambda · Chapter 607</div>
    </div>
  </div>
  <div class="sidebar-user">
    <div class="user-avatar" id="sidebarAvatar">?</div>
    <div class="user-info">
      <div class="uname" id="sidebarName">Loading…</div>
      <div class="urole" id="sidebarRole">Member</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Finance</div>
    <a class="nav-item" href="dashboard.html"><i class="fas fa-chart-pie"></i> Dashboard</a>
    <a class="nav-item" href="pay-dues.html"><i class="fas fa-dollar-sign"></i> Pay Dues</a>
    <a class="nav-item active" href="requests.html"><i class="fas fa-inbox"></i> Member Requests</a>
    <hr class="nav-divider" />
    <div class="nav-label">Account</div>
    <a class="nav-item" href="../member-portal.html"><i class="fas fa-arrow-left"></i> Member Portal</a>
    <a class="nav-item" id="adminNavLink" href="admin/index.html" style="display:none;"><i class="fas fa-shield-halved"></i> Finance Admin</a>
  </nav>
  <div class="sidebar-footer">
    <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
  </div>
</aside>

<div class="main">
  <header class="topbar">
    <div>
      <span class="page-title">Member Requests</span>
      <span class="breadcrumb">Finance Portal</span>
    </div>
  </header>
  <div class="content">
    <div class="card">
      <div class="card-title"><i class="fas fa-inbox"></i> Requisitions &amp; Reimbursements</div>
      <div class="card-sub">Review and action member requests. Pending items require your approval or denial.</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px;">
        <button class="type-btn active" id="typeBtn-requisition" onclick="switchType('requisition')"><i class="fas fa-file-invoice-dollar"></i> Requisitions</button>
        <button class="type-btn" id="typeBtn-reimbursement" onclick="switchType('reimbursement')"><i class="fas fa-receipt"></i> Reimbursements</button>
        <select class="filter-sel" id="statusFilter" onchange="loadRequests()" style="margin-left:auto;">
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="denied">Denied</option>
          <option value="">All</option>
        </select>
      </div>
      <div id="requestsTable" style="overflow-x:auto;">
        <div class="empty"><i class="fas fa-spinner fa-spin" style="font-size:1.4rem;margin-bottom:10px;display:block;"></i> Loading…</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

<script>
  const SB_URL  = 'https://fbjervpgxnbyntylabfr.supabase.co';
  const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiamVydnBneG5ieW50eWxhYmZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NzU1ODksImV4cCI6MjA5MjA1MTU4OX0.cMGLe14EDNivZHREWvmE7QMHjb4V_STx0Mfbx7AT4dg';

  let SESSION = null;
  let currentType = 'requisition';

  function getToken() {
    const admin  = JSON.parse(localStorage.getItem('nda_sb_session')    || 'null');
    const member = JSON.parse(localStorage.getItem('nda_member_session') || 'null');
    return admin?.access_token || member?.access_token || SB_ANON;
  }

  async function sbGet(table, params) {
    const url = new URL(SB_URL + '/rest/v1/' + table);
    Object.entries(params || {}).forEach(([k, v]) => url.searchParams.set(k, v));
    const r = await fetch(url, { headers: { apikey: SB_ANON, Authorization: 'Bearer ' + getToken(), Accept: 'application/json' } });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  function escHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmt$(cents) { return '$' + ((cents||0)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fmtDate(iso) { if (!iso) return '—'; return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }

  let toastTimer;
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.querySelector('#toastMsg').textContent = msg;
    t.className = 'toast' + (type==='error'?' error':'') + ' show';
    t.querySelector('i').className = type==='error' ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
  }

  function switchType(type) {
    currentType = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.id === 'typeBtn-' + type));
    loadRequests();
  }

  async function loadRequests() {
    const table  = currentType === 'requisition' ? 'finance_requisitions' : 'finance_reimbursements';
    const status = document.getElementById('statusFilter').value;
    const params = { order: 'submitted_at.desc' };
    if (status) params['status'] = 'eq.' + status;
    const el = document.getElementById('requestsTable');
    el.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin" style="font-size:1.4rem;margin-bottom:10px;display:block;"></i> Loading…</div>';
    try {
      const rows = await sbGet(table, params);
      if (!rows || !rows.length) {
        el.innerHTML = '<div class="empty"><i class="fas fa-inbox" style="font-size:1.8rem;margin-bottom:10px;display:block;"></i>No requests found.</div>';
        return;
      }
      const memberIds = [...new Set(rows.map(r => r.member_id).filter(Boolean))];
      let memberMap = {};
      if (memberIds.length) {
        const mems = await sbGet('members', { id: 'in.(' + memberIds.join(',') + ')', select: 'id,first_name,last_name' });
        (mems || []).forEach(m => { memberMap[m.id] = m.first_name + ' ' + m.last_name; });
      }
      const isReimb = currentType === 'reimbursement';
      el.innerHTML = '<table>' +
        '<thead><tr>' +
        '<th>Member</th><th>Description</th>' +
        (isReimb ? '<th>Receipt</th>' : '<th>Doc</th>') +
        '<th style="text-align:right;">Amount</th>' +
        '<th>Submitted</th><th>Status</th><th>Actions</th>' +
        '</tr></thead><tbody>' +
        rows.map(function(r) {
          const name    = escHtml(memberMap[r.member_id] || r.member_name || '—');
          const desc    = escHtml(r.description || r.item_service || '—');
          const amount  = fmt$(r.amount_cents);
          const date    = fmtDate(r.submitted_at);
          const docUrl  = isReimb ? r.receipt_url : r.doc_url;
          const docLink = docUrl
            ? '<a href="' + escHtml(docUrl) + '" target="_blank" style="color:var(--gold);font-size:0.78rem;"><i class="fas fa-paperclip"></i> View</a>'
            : '<span style="color:rgba(255,255,255,0.2);">—</span>';
          const badge = '<span class="badge badge-' + (r.status||'pending') + '">' + (r.status||'pending') + '</span>';
          const actions = r.status === 'pending'
            ? '<button class="btn-approve" onclick="reviewRequest(\'' + r.id + '\',\'approved\')"><i class="fas fa-check"></i> Approve</button>' +
              '<button class="btn-deny"    onclick="reviewRequest(\'' + r.id + '\',\'denied\')"><i class="fas fa-times"></i> Deny</button>'
            : '<span style="font-size:0.75rem;color:rgba(255,255,255,0.2);">—</span>';
          return '<tr><td>' + name + '</td><td style="max-width:220px;">' + desc + '</td><td>' + docLink + '</td>' +
            '<td style="text-align:right;font-weight:600;color:var(--gold);">' + amount + '</td>' +
            '<td style="color:var(--gray-400);">' + date + '</td><td>' + badge + '</td><td>' + actions + '</td></tr>';
        }).join('') +
        '</tbody></table>';
    } catch(e) {
      el.innerHTML = '<div class="empty" style="color:var(--red);">Error loading: ' + escHtml(String(e)) + '</div>';
    }
  }

  async function reviewRequest(id, newStatus) {
    const table = currentType === 'requisition' ? 'finance_requisitions' : 'finance_reimbursements';
    const note  = newStatus === 'denied' ? (prompt('Optional: enter a reason for denial') || null) : null;
    try {
      const r = await fetch(SB_URL + '/rest/v1/' + table + '?id=eq.' + id, {
        method: 'PATCH',
        headers: { apikey: SB_ANON, Authorization: 'Bearer ' + getToken(), 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({ status: newStatus, review_note: note, reviewed_at: new Date().toISOString() })
      });
      if (!r.ok) throw new Error(await r.text());
      showToast((newStatus === 'approved' ? 'Approved' : 'Denied') + ' successfully.');
      loadRequests();
    } catch(e) {
      showToast('Error: ' + e.message, 'error');
    }
  }

  function logout() {
    localStorage.removeItem('nda_member_session');
    localStorage.removeItem('nda_sb_session');
    window.location.href = '../member-portal.html';
  }

  async function init() {
    const adminSession  = JSON.parse(localStorage.getItem('nda_sb_session')    || 'null');
    const memberSession = JSON.parse(localStorage.getItem('nda_member_session') || 'null');
    SESSION = adminSession || memberSession;
    if (!SESSION?.access_token) { window.location.href = '../member-portal.html'; return; }

    // Populate sidebar user info
    try {
      const rows = await sbGet('members', { auth_user_id: 'eq.' + SESSION.user.id, select: 'first_name,last_name,photo,finance_role,chapter_role', limit: '1' });
      const m = rows && rows[0];
      if (m) {
        document.getElementById('sidebarName').textContent = (m.first_name || '') + ' ' + (m.last_name || '');
        document.getElementById('sidebarRole').textContent = m.finance_role || m.chapter_role || 'Member';
        if (m.photo) document.getElementById('sidebarAvatar').innerHTML = '<img src="' + escHtml(m.photo) + '" />';
        else document.getElementById('sidebarAvatar').textContent = (m.first_name||'?')[0].toUpperCase();
      }
    } catch(_) {}

    // Show finance admin link for admins
    if (adminSession?.access_token) document.getElementById('adminNavLink').style.display = '';

    loadRequests();
  }

  init();
</script>
</body>
</html>
