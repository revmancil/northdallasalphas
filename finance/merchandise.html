<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merchandise | North Dallas Alphas</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../images/xtl-logo.png" type="image/png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black:#0a0a0a; --dark:#111; --dark2:#181818;
      --gold:#C9A84C; --gold-pale:rgba(201,168,76,0.08); --gold-pale2:rgba(201,168,76,0.15);
      --white:#ffffff; --gray-400:#9ca3af;
      --green:#22c55e; --green-pale:rgba(34,197,94,0.1);
      --red:#ef4444; --red-pale:rgba(239,68,68,0.1);
      --blue:#3b82f6; --blue-pale:rgba(59,130,246,0.1);
      --sidebar-w:260px;
    }
    html,body{height:100%;}
    body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--white);display:flex;min-height:100vh;}

    /* ── Sidebar ── */
    .sidebar{width:var(--sidebar-w);background:var(--dark2);border-right:1px solid rgba(201,168,76,0.12);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100;transition:transform 0.3s;overflow-y:auto;-webkit-overflow-scrolling:touch;}
    .sidebar-brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:12px;flex-shrink:0;}
    .sidebar-brand img{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(201,168,76,0.4);object-fit:contain;}
    .sidebar-brand-text .name{font-family:'Playfair Display',serif;font-size:0.88rem;font-weight:700;color:var(--gold);line-height:1.2;}
    .sidebar-brand-text .sub{font-size:0.62rem;color:rgba(255,255,255,0.3);letter-spacing:0.08em;text-transform:uppercase;}
    .sidebar-user{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:12px;}
    .user-avatar{width:34px;height:34px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.82rem;color:var(--black);flex-shrink:0;overflow:hidden;}
    .user-avatar img{width:100%;height:100%;object-fit:cover;}
    .user-info .uname{font-size:0.82rem;font-weight:600;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .user-info .urole{font-size:0.7rem;color:rgba(255,255,255,0.35);margin-top:2px;}
    .sidebar-nav{padding:10px 0;flex:1;}
    .nav-label{font-size:0.62rem;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:rgba(255,255,255,0.22);padding:10px 20px 5px;}
    .nav-item{display:flex;align-items:center;gap:11px;padding:10px 20px;color:rgba(255,255,255,0.5);font-size:0.85rem;font-weight:500;border:none;background:none;width:100%;text-align:left;transition:color 0.2s,background 0.2s;border-left:3px solid transparent;text-decoration:none;cursor:pointer;}
    .nav-item i{width:18px;text-align:center;font-size:0.88rem;}
    .nav-item:hover{color:var(--white);background:rgba(255,255,255,0.04);}
    .nav-item.active{color:var(--gold);background:var(--gold-pale);border-left-color:var(--gold);}
    .nav-divider{border:none;border-top:1px solid rgba(255,255,255,0.06);margin:6px 0;}
    .sidebar-footer{padding:14px 20px;border-top:1px solid rgba(255,255,255,0.06);}
    .logout-btn{display:flex;align-items:center;gap:9px;color:rgba(255,255,255,0.4);font-size:0.82rem;background:none;border:none;cursor:pointer;padding:7px 0;transition:color 0.2s;width:100%;}
    .logout-btn:hover{color:var(--red);}

    /* ── Main ── */
    .main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;}
    .topbar{background:var(--dark2);border-bottom:1px solid rgba(255,255,255,0.06);padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
    .topbar-left{display:flex;align-items:center;gap:12px;}
    .hamburger{display:none;background:none;border:none;color:var(--white);font-size:1.1rem;cursor:pointer;padding:6px;}
    .page-title{font-size:1rem;font-weight:600;color:var(--white);}
    .breadcrumb{font-size:0.78rem;color:var(--gray-400);margin-left:6px;}
    .content{padding:28px;flex:1;}

    /* ── Filter pills ── */
    .filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
    .filter-pill{padding:7px 16px;border-radius:20px;font-size:0.8rem;font-weight:600;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.5);cursor:pointer;transition:all 0.2s;}
    .filter-pill:hover{color:var(--white);border-color:rgba(255,255,255,0.3);}
    .filter-pill.active{background:var(--gold-pale2);border-color:var(--gold);color:var(--gold);}

    /* ── Product grid ── */
    .merch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px;}
    .merch-card{background:var(--dark2);border:1px solid rgba(255,255,255,0.07);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color 0.2s,transform 0.2s;}
    .merch-card:hover{border-color:rgba(201,168,76,0.3);transform:translateY(-2px);}
    .merch-card-img{width:100%;height:180px;object-fit:cover;background:rgba(255,255,255,0.04);}
    .merch-card-img-placeholder{width:100%;height:180px;background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.12);font-size:2.5rem;}
    .merch-card-body{padding:16px;flex:1;display:flex;flex-direction:column;}
    .merch-card-category{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
    .merch-card-name{font-size:0.95rem;font-weight:700;color:var(--white);margin-bottom:6px;}
    .merch-card-desc{font-size:0.8rem;color:var(--gray-400);line-height:1.5;flex:1;margin-bottom:14px;}
    .merch-card-footer{display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .merch-card-price{font-size:1.1rem;font-weight:700;color:var(--gold);}
    .btn-order{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:0.8rem;font-weight:600;background:var(--gold);color:var(--black);border:none;cursor:pointer;transition:background 0.2s;}
    .btn-order:hover{background:#d4a84c;}

    /* ── Empty / loading ── */
    .empty-state{text-align:center;padding:60px 20px;color:var(--gray-400);}
    .empty-state i{font-size:2.5rem;margin-bottom:14px;color:rgba(255,255,255,0.15);display:block;}
    .empty-state p{font-size:0.88rem;line-height:1.6;}

    /* ── Order modal ── */
    .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:500;display:none;align-items:center;justify-content:center;padding:16px;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--dark2);border:1px solid rgba(255,255,255,0.1);border-radius:16px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:28px;}
    .modal-title{font-size:1rem;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:8px;}
    .modal-title i{color:var(--gold);}
    .modal-close{background:none;border:none;color:var(--gray-400);font-size:1rem;cursor:pointer;margin-left:auto;padding:4px;}
    .modal-close:hover{color:var(--white);}
    .modal-img{width:100%;height:200px;object-fit:cover;border-radius:10px;margin-bottom:16px;background:rgba(255,255,255,0.04);}
    .modal-img-placeholder{width:100%;height:200px;border-radius:10px;margin-bottom:16px;background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.12);font-size:3rem;}
    .modal-price{font-size:1.4rem;font-weight:700;color:var(--gold);margin-bottom:16px;}
    .modal-desc{font-size:0.85rem;color:var(--gray-400);line-height:1.6;margin-bottom:20px;}
    .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
    .field label{font-size:0.75rem;font-weight:700;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.06em;}
    .field input,.field select,.field textarea{background:#0f0f0f;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px 12px;color:var(--white);font-size:0.88rem;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.2s;width:100%;}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);}
    .field select option{background:#1a1a1a;}
    .btn-gold{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;border-radius:8px;font-size:0.88rem;font-weight:600;background:var(--gold);color:var(--black);border:none;cursor:pointer;transition:all 0.2s;width:100%;justify-content:center;}
    .btn-gold:hover{background:#d4a84c;}
    .btn-gold:disabled{opacity:0.5;pointer-events:none;}
    .notice{background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.2);border-radius:8px;padding:12px 14px;font-size:0.8rem;color:#93c5fd;line-height:1.5;margin-bottom:16px;}
    .success-msg{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.25);color:#4ade80;padding:12px 16px;border-radius:8px;font-size:0.85rem;display:none;margin-bottom:14px;}

    /* ── Toast ── */
    .toast{position:fixed;bottom:28px;right:28px;background:#1f1f1f;border:1px solid rgba(255,255,255,0.12);border-radius:12px;padding:14px 20px;display:flex;align-items:center;gap:10px;font-size:0.85rem;z-index:9999;transform:translateY(80px);opacity:0;transition:all 0.35s;pointer-events:none;max-width:340px;}
    .toast.show{transform:translateY(0);opacity:1;}
    .toast.success i{color:var(--green);}
    .toast.error i{color:var(--red);}

    /* ── Mobile ── */
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:99;}
    @media(max-width:768px){
      .sidebar{transform:translateX(-100%);}
      .sidebar.open{transform:translateX(0);}
      .sidebar-overlay.show{display:block;}
      .main{margin-left:0;}
      .hamburger{display:flex;}
      .content{padding:16px;}
      .merch-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
    }
  </style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <img src="../images/xtl-logo.png" alt="NDA" />
    <div class="sidebar-brand-text">
      <div class="name">North Dallas Alphas</div>
      <div class="sub">Finance Portal</div>
    </div>
  </div>
  <div class="sidebar-user">
    <div class="user-avatar" id="sidebarAvatar"></div>
    <div class="user-info">
      <div class="uname" id="sidebarName">Loading…</div>
      <div class="urole" id="sidebarRole">Member</div>
    </div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Finance</div>
    <a class="nav-item" href="dashboard.html"><i class="fas fa-chart-line"></i> Dashboard</a>
    <a class="nav-item" href="pay-dues.html"><i class="fas fa-credit-card"></i> Pay Dues</a>
    <a class="nav-item active" href="merchandise.html"><i class="fas fa-store"></i> Merchandise</a>
    <hr class="nav-divider" />
    <a class="nav-item" href="../member-portal.html"><i class="fas fa-arrow-left"></i> Member Portal</a>
    <a class="nav-item" id="financeAdminLink" href="admin/index.html" style="display:none;"><i class="fas fa-tools"></i> Finance Admin</a>
    <a class="nav-item" href="requests.html"><i class="fas fa-inbox"></i> Member Requests</a>
  </nav>
  <div class="sidebar-footer">
    <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
  </div>
</nav>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="hamburger" onclick="openSidebar()"><i class="fas fa-bars"></i></button>
      <span class="page-title">Merchandise</span>
      <span class="breadcrumb">/ Chapter Store</span>
    </div>
  </div>

  <div class="content">

    <div class="filter-row" id="filterRow">
      <button class="filter-pill active" data-cat="all" onclick="filterCat(this,'all')">All Items</button>
    </div>

    <div class="merch-grid" id="merchGrid">
      <div class="empty-state" style="grid-column:1/-1;">
        <i class="fas fa-spinner fa-spin"></i>
        <p>Loading merchandise…</p>
      </div>
    </div>

  </div>
</div>

<!-- Order Modal -->
<div class="modal-overlay" id="orderModal">
  <div class="modal">
    <div class="modal-title"><i class="fas fa-shopping-bag"></i> <span id="omTitle">Place Order</span> <button class="modal-close" onclick="closeOrderModal()"><i class="fas fa-times"></i></button></div>
    <div id="omImgWrap"></div>
    <div class="modal-price" id="omPrice"></div>
    <div class="modal-desc" id="omDesc"></div>

    <!-- Size selector (shown for sized items) -->
    <div class="field" id="omSizeField" style="display:none;">
      <label>Select Size</label>
      <select id="omSize" onchange="onSizeChange()"></select>
    </div>

    <div class="field">
      <label>Quantity</label>
      <input type="number" id="omQty" value="1" min="1" max="10" oninput="onQtyChange()" />
    </div>

    <!-- Order summary -->
    <div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:14px 16px;margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:6px;">
        <span style="color:var(--gray-400);">Item price</span>
        <span id="omUnitPrice" style="color:var(--white);font-weight:600;">—</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:6px;">
        <span style="color:var(--gray-400);">Processing fee</span>
        <span id="omFeePrice" style="color:var(--gray-400);">—</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:1rem;border-top:1px solid rgba(255,255,255,0.08);padding-top:10px;margin-top:4px;">
        <span style="font-weight:700;color:var(--white);">Total</span>
        <span id="omTotalPrice" style="font-weight:800;color:var(--gold);">—</span>
      </div>
    </div>

    <div id="omErr" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#f87171;padding:10px 14px;border-radius:8px;font-size:0.83rem;margin-bottom:12px;"></div>

    <button class="btn-gold" id="omSubmitBtn" onclick="startMerchCheckout()">
      <i class="fas fa-lock"></i> <span id="omBtnLabel">Pay with Card</span>
    </button>
    <div style="display:flex;align-items:center;gap:6px;justify-content:center;margin-top:10px;font-size:0.75rem;color:rgba(255,255,255,0.3);">
      <i class="fab fa-stripe"></i> Secured by Stripe · PCI compliant
    </div>

    <input type="hidden" id="omProductKey" />
    <input type="hidden" id="omItemName" />
  </div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

<script>
  const SB_URL  = 'https://fbjervpgxnbyntylabfr.supabase.co';
  const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiamVydnBneG5ieW50eWxhYmZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NzU1ODksImV4cCI6MjA5MjA1MTU4OX0.cMGLe14EDNivZHREWvmE7QMHjb4V_STx0Mfbx7AT4dg';
  const STRIPE_FN_URL = SB_URL + '/functions/v1/stripe-checkout';
  const CATALOG_KEY = 'finance_merch_catalog';

  // ── Chapter Store Products (Stripe-wired) ───────────────────────────────────
  const CHAPTER_PRODUCTS = [
    {
      id: 'chapter-blazer',
      product_key: 'chapter-blazer',
      name: 'Chapter Blazer',
      category: 'Apparel',
      description: 'Official Xi Tau Lambda chapter blazer.',
      hasSizes: true,
      sizeType: 'numeric',
      sizes: ['34','36','38','40','42','44','46','48','50','52','54','56','58','60','62','64','66'],
      priceTiers: [
        { sizes: ['34','36','38','40','42','44','46','48','50','52','54','56','58','60'], price_cents: 15000, label: '$150.00' },
        { sizes: ['62','64','66'],                                                        price_cents: 20000, label: '$200.00' },
      ],
    },
    {
      id: 'chapter-polo',
      product_key: 'chapter-polo',
      name: 'Chapter Polo',
      category: 'Apparel',
      description: 'Official Xi Tau Lambda chapter polo shirt.',
      hasSizes: true,
      sizeType: 'standard',
      sizes: ['S','M','L','XL','2X','3X','4X','5X','6X'],
      priceTiers: [
        { sizes: ['S','M','L','XL'],   price_cents: 3200, label: '$32.00' },
        { sizes: ['2X','3X'],          price_cents: 3600, label: '$36.00' },
        { sizes: ['4X','5X','6X'],     price_cents: 4000, label: '$40.00' },
      ],
    },
    {
      id: 'chenille-sweatshirt',
      product_key: 'chenille-sweatshirt',
      name: 'Chenille "A" Sweatshirt',
      category: 'Apparel',
      description: 'Chapter sweatshirt with chenille Alpha letter. Sizes S–2X.',
      hasSizes: true,
      sizeType: 'standard',
      sizes: ['S','M','L','XL','2X'],
      priceTiers: [
        { sizes: ['S','M','L','XL','2X'], price_cents: 6500, label: '$65.00' },
      ],
    },
    {
      id: 'chapter-necktie',
      product_key: 'chapter-necktie',
      name: 'Chapter Necktie',
      category: 'Accessories',
      description: 'Official Xi Tau Lambda chapter necktie.',
      hasSizes: false,
      sizes: [],
      priceTiers: [{ sizes: [], price_cents: 2700, label: '$27.00' }],
    },
    {
      id: 'chapter-bowtie',
      product_key: 'chapter-bowtie',
      name: 'Chapter Bowtie',
      category: 'Accessories',
      description: 'Official Xi Tau Lambda chapter bowtie.',
      hasSizes: false,
      sizes: [],
      priceTiers: [{ sizes: [], price_cents: 2700, label: '$27.00' }],
    },
  ];

  let SESSION = null;
  let allItems = [];
  let currentCat = 'all';

  function authToken() {
    return SESSION?.access_token || SB_ANON;
  }

  async function sbGet(path, params) {
    const url = new URL(`${SB_URL}/rest/v1/${path}`);
    if (params) Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
    const r = await fetch(url, { headers: { apikey: SB_ANON, Authorization: `Bearer ${authToken()}`, Accept: 'application/json' } });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  async function sbPost(path, body) {
    const r = await fetch(`${SB_URL}/rest/v1/${path}`, {
      method: 'POST',
      headers: { apikey: SB_ANON, Authorization: `Bearer ${authToken()}`, 'Content-Type': 'application/json', Prefer: 'return=representation' },
      body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  }

  async function getContentJson(key) {
    try {
      const rows = await sbGet('site_content', { content_key: `eq.${key}`, select: 'content_value' });
      return rows.length ? rows[0].content_value : null;
    } catch { return null; }
  }

  function fmt$(cents) {
    if (!cents || cents === 0) return 'Free';
    return '$' + (cents / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.className = `toast ${type}`;
    el.querySelector('i').className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
    document.getElementById('toastMsg').textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 3500);
  }

  function openSidebar()  { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('show'); }
  function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('show'); }
  function logout() { localStorage.removeItem('nda_member_session'); window.location.href = '../member-portal.html'; }

  function filterCat(el, cat) {
    document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    currentCat = cat;
    renderGrid();
  }

  function renderGrid() {
    const grid = document.getElementById('merchGrid');
    const items = currentCat === 'all' ? allItems : allItems.filter(i => i.category === currentCat);

    if (!items.length) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">
        <i class="fas fa-store"></i>
        <p>${currentCat === 'all' ? 'No merchandise available at this time. Check back soon.' : 'No items in this category.'}</p>
      </div>`;
      return;
    }

    grid.innerHTML = items.map(item => `
      <div class="merch-card">
        ${item.image_url
          ? `<img class="merch-card-img" src="${escHtml(item.image_url)}" alt="${escHtml(item.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" /><div class="merch-card-img-placeholder" style="display:none;"><i class="fas fa-box-open"></i></div>`
          : `<div class="merch-card-img-placeholder"><i class="fas fa-box-open"></i></div>`}
        <div class="merch-card-body">
          <div class="merch-card-category">${escHtml(item.category || 'General')}</div>
          <div class="merch-card-name">${escHtml(item.name)}</div>
          ${item.description ? `<div class="merch-card-desc">${escHtml(item.description)}</div>` : '<div class="merch-card-desc"></div>'}
          <div class="merch-card-footer">
            <div class="merch-card-price">${item.priceTiers ? (item.priceTiers[0].label + (item.priceTiers.length > 1 ? '+' : '')) : fmt$(item.price_cents)}</div>
            <button class="btn-order" onclick='openOrderModal(window.__merch[${JSON.stringify(item.id)}])'><i class="fas fa-shopping-bag"></i> Order</button>
          </div>
        </div>
      </div>`).join('');
  }

  function escHtml(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Active product being ordered ─────────────────────────────────────────
  let activeProduct = null;

  function getPriceTierForSize(product, size) {
    if (!product.hasSizes) return product.priceTiers[0];
    for (const tier of product.priceTiers) {
      if (tier.sizes.includes(size)) return tier;
    }
    return product.priceTiers[0];
  }

  function calcFeeDisplay(subtotalCents) {
    const fee = Math.ceil((subtotalCents * 0.029 + 30) / 0.971);
    return fee;
  }

  function updateOrderSummary() {
    if (!activeProduct) return;
    const size = document.getElementById('omSize').value || 'N/A';
    const qty  = Math.max(1, parseInt(document.getElementById('omQty').value) || 1);
    const tier = getPriceTierForSize(activeProduct, size);
    const unit = tier ? tier.price_cents : 0;
    const sub  = unit * qty;
    const fee  = calcFeeDisplay(sub);
    const tot  = sub + fee;

    document.getElementById('omPrice').textContent      = tier ? tier.label : fmt$(unit);
    document.getElementById('omUnitPrice').textContent  = fmt$(unit) + (qty > 1 ? ' × ' + qty : '');
    document.getElementById('omFeePrice').textContent   = fmt$(fee);
    document.getElementById('omTotalPrice').textContent = fmt$(tot);
    document.getElementById('omBtnLabel').textContent   = 'Pay ' + fmt$(tot) + ' with Card';
  }

  function onSizeChange() { updateOrderSummary(); }
  function onQtyChange()  { updateOrderSummary(); }

  function openOrderModal(item) {
    // item can be a CHAPTER_PRODUCTS entry or a catalog item from Supabase
    activeProduct = item;

    document.getElementById('omTitle').textContent    = item.name;
    document.getElementById('omDesc').textContent     = item.description || '';
    document.getElementById('omProductKey').value     = item.product_key || item.id || '';
    document.getElementById('omItemName').value       = item.name || '';
    document.getElementById('omQty').value            = 1;
    document.getElementById('omErr').style.display    = 'none';
    document.getElementById('omSubmitBtn').disabled   = false;
    document.getElementById('omBtnLabel').textContent = 'Pay with Card';

    const imgWrap = document.getElementById('omImgWrap');
    imgWrap.innerHTML = item.image_url
      ? `<img class="modal-img" src="${escHtml(item.image_url)}" alt="${escHtml(item.name)}" onerror="this.outerHTML='<div class=modal-img-placeholder><i class=fas fa-box-open></i></div>'" />`
      : `<div class="modal-img-placeholder"><i class="fas fa-box-open"></i></div>`;

    const sizeField = document.getElementById('omSizeField');
    const sizeEl    = document.getElementById('omSize');
    if (item.hasSizes && item.sizes && item.sizes.length) {
      sizeField.style.display = '';
      sizeEl.innerHTML = item.sizes.map(s => `<option value="${escHtml(s)}">${escHtml(s)}</option>`).join('');
      sizeEl.value = item.sizes[0];
    } else {
      sizeField.style.display = 'none';
      sizeEl.innerHTML = '<option value="N/A">N/A</option>';
    }

    updateOrderSummary();
    document.getElementById('orderModal').classList.add('open');
  }

  function closeOrderModal() {
    document.getElementById('orderModal').classList.remove('open');
    activeProduct = null;
  }

  async function startMerchCheckout() {
    if (!SESSION) { showErr('Please sign in to purchase.'); return; }
    if (!activeProduct) return;

    const btn      = document.getElementById('omSubmitBtn');
    const size     = document.getElementById('omSize').value || 'N/A';
    const qty      = Math.max(1, parseInt(document.getElementById('omQty').value) || 1);
    const prodKey  = document.getElementById('omProductKey').value;
    const name     = document.getElementById('omItemName').value;

    if (activeProduct.hasSizes && (!size || size === 'N/A')) {
      showErr('Please select a size.'); return;
    }

    document.getElementById('omErr').style.display = 'none';
    btn.disabled = true;
    document.getElementById('omBtnLabel').textContent = 'Redirecting to Stripe…';
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Redirecting to Stripe…';

    try {
      const meta   = SESSION.user?.user_metadata || {};
      const email  = SESSION.user?.email || '';
      const fName  = meta.full_name || name || '';

      const res = await fetch(STRIPE_FN_URL, {
        method: 'POST',
        headers: {
          'Content-Type':  'application/json',
          'apikey':        SB_ANON,
          'Authorization': 'Bearer ' + SESSION.access_token,
        },
        body: JSON.stringify({
          mode:        'store',
          fullName:    fName,
          phone:       meta.phone || '',
          email:       email,
          notes:       '',
          items: [{
            product_key: prodKey,
            name:        name,
            size:        size,
            quantity:    qty,
          }],
          successUrl: window.location.origin + window.location.pathname + '?payment=success',
          cancelUrl:  window.location.origin + window.location.pathname + '?payment=cancelled',
        }),
      });

      let data = null;
      try { data = await res.json(); } catch(_) { data = { error: await res.text() }; }

      if (!res.ok || !data?.url) throw new Error((data && data.error) || 'Checkout unavailable.');
      window.location.href = data.url;
    } catch(e) {
      showErr((e && e.message) || 'Could not start checkout. Please try again.');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-lock"></i> <span id="omBtnLabel">Pay with Card</span>';
    }
  }

  function showErr(msg) {
    const el = document.getElementById('omErr');
    el.textContent = msg;
    el.style.display = '';
  }

  async function init() {
    SESSION = JSON.parse(localStorage.getItem('nda_member_session') || 'null');
    if (!SESSION) { window.location.href = '../member-portal.html'; return; }

    const meta = SESSION.user?.user_metadata || {};
    const name = meta.full_name || SESSION.user?.email || 'Member';
    const initials = name.split(' ').map(p => p[0]).join('').toUpperCase().slice(0, 2);
    document.getElementById('sidebarName').textContent = name;
    const av = document.getElementById('sidebarAvatar');
    if (meta.avatar_url) av.innerHTML = `<img src="${meta.avatar_url}" alt="" />`;
    else av.textContent = initials;

    // Show Finance Admin link if applicable
    try {
      const rows = await sbGet('members', { select: 'finance_role', auth_user_id: `eq.${SESSION.user.id}`, limit: '1' });
      const role = rows[0]?.finance_role;
      if (['treasurer','financial_secretary','president'].includes(role)) {
        document.getElementById('financeAdminLink').style.display = '';
      }
    } catch(_) {}
    // Also show for site admins
    const adminSession = JSON.parse(localStorage.getItem('nda_sb_session') || 'null');
    if (adminSession?.access_token) {
      document.getElementById('financeAdminLink').style.display = '';
    }

    // Handle payment success/cancel redirect
    const params = new URLSearchParams(window.location.search);
    if (params.get('payment') === 'success') {
      toast('Payment successful! Your order has been received.', 'success');
      window.history.replaceState({}, '', window.location.pathname);
    } else if (params.get('payment') === 'cancelled') {
      toast('Checkout cancelled.', 'error');
      window.history.replaceState({}, '', window.location.pathname);
    }

    // Load chapter products (hard-coded with Stripe pricing) + optional catalog items
    const catalog = await getContentJson(CATALOG_KEY);
    const catalogItems = Array.isArray(catalog) ? catalog.filter(i => i.active !== false) : [];
    allItems = [...CHAPTER_PRODUCTS, ...catalogItems.filter(i => !CHAPTER_PRODUCTS.find(p => p.id === i.id))];
    window.__merch = Object.fromEntries(allItems.map(i => [i.id, i]));

    // Build category filter pills
    const cats = [...new Set(allItems.map(i => i.category).filter(Boolean))];
    const filterRow = document.getElementById('filterRow');
    cats.forEach(cat => {
      const pill = document.createElement('button');
      pill.className = 'filter-pill';
      pill.dataset.cat = cat;
      pill.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
      pill.onclick = () => filterCat(pill, cat);
      filterRow.appendChild(pill);
    });

    renderGrid();
  }

  init();
</script>
</body>
</html>
